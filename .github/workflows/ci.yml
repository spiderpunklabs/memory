name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Reusable workflows hosted in spiderpunklabs/workstation, pinned by SHA.
# Renovate (configured in renovate.json) auto-PRs SHA updates weekly.

jobs:
  gitleaks:
    uses: spiderpunklabs/workstation/.github/workflows/gitleaks.yml@5cdcf185b262943362bf025e4ff875e13b1d81d9 # ci-templates v1.0.0

  actionlint:
    uses: spiderpunklabs/workstation/.github/workflows/actionlint.yml@5cdcf185b262943362bf025e4ff875e13b1d81d9 # ci-templates v1.0.0

  markdownlint:
    uses: spiderpunklabs/workstation/.github/workflows/markdownlint-warning.yml@5cdcf185b262943362bf025e4ff875e13b1d81d9 # ci-templates v1.0.0

  skill-schema:
    uses: spiderpunklabs/workstation/.github/workflows/skill-schema.yml@5cdcf185b262943362bf025e4ff875e13b1d81d9 # ci-templates v1.0.0

  hook-parity:
    # Defends against developers who skipped `lefthook install`: runs the
    # canonical pre-commit checks against the PR diff so a missing local
    # hook still gets caught at CI time.
    name: hook-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify hook runner exists
        run: test -x scripts/check-staged.sh
      - name: Run hook script against PR diff
        run: |
          base="${{ github.base_ref }}"
          if [ -n "$base" ]; then
            git fetch origin "$base" --depth=1
            git diff "origin/$base"...HEAD --name-only -z | xargs -0 -I{} git add --intent-to-add {} 2>/dev/null || true
            git diff "origin/$base"...HEAD --name-only -z | xargs -0 git update-index --add 2>/dev/null || true
          fi
          bash scripts/check-staged.sh
